name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Installer dry run
        run: |
          key_file="$(mktemp)"
          ./scripts/install.sh \
            --root "$PWD" \
            --tunnel-id tunnel_example \
            --runtime-api-key-file "$key_file" \
            --dry-run
