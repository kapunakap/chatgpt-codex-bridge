name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: JavaScript syntax checks
        run: |
          node --check adapter.mjs
          node --check bin/local-codex-secure.mjs
          node --check scripts/render-profile.mjs

  macos-install:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Fresh and legacy installer dry runs
        run: |
          key_file="$(mktemp)"
          ./scripts/install.sh \
            --tunnel-id tunnel_example \
            --runtime-api-key-file "$key_file" \
            --dry-run
          ./scripts/install.sh \
            --root "$PWD" \
            --tunnel-id tunnel_example \
            --runtime-api-key-file "$key_file" \
            --dry-run
